name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the queue, ledger, worker and API tests. Trust auth: it holds
    # no data, accepts only this job's connections and is destroyed with the runner.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARSEMAXXING_TEST_DSN: postgresql://postgres@localhost:5432/parsemaxxing_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pipx install semgrep==1.182.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: make setup
      - name: Install the browser for the end-to-end tests
        run: cd web && npx playwright install --with-deps chromium
      - run: make lint
      - run: make test
      - run: make security

  # Both images built as `make up` builds them, then a CycloneDX SBOM per image (kept as an
  # artifact) and a Trivy scan that fails on fixable HIGH or CRITICAL findings (.trivyignore).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the engine and web images
        run: docker compose --env-file .env.example build engine web
      - run: scripts/image_check.sh sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          retention-days: 30
      - run: scripts/image_check.sh scan

  # LDAP sign-in against a real OpenLDAP container (engine/tests/auth/test_ldap_integration.py).
  # PARSEMAXXING_LDAP_IT=1 makes a missing docker or a failed image build a failure, not a skip.
  ldap-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARSEMAXXING_TEST_DSN: postgresql://postgres@localhost:5432/parsemaxxing_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the engine
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e 'engine[dev]'
      - run: make ldap-test

  # Encrypted backup and restore round trip against a real PostgreSQL (scripts/restore_test.sh).
  restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap .env and the Docker secrets (throwaway values)
        run: make secrets
      - run: scripts/restore_test.sh
